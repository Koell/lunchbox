name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Safety net: every later step sees CLAUDE_CONFIG_DIR, XDG_CONFIG_HOME and
      # GIT_CONFIG_GLOBAL pointing into the runner's temp directory, so nothing
      # can ever touch a real ~/.claude, ~/.config/git or ~/.gitconfig. The smoke
      # steps override them with their own fresh paths.
      - name: Point module targets at temp directories
        shell: bash
        run: |
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg-config" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"

      - name: Unit tests
        run: python -m unittest -v

      # Runs on all three OSes: native bash on Linux/macOS, Git Bash on Windows.
      - name: Smoke test (sh entry scripts)
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-sh
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-sh
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-sh
        run: |
          target="$CLAUDE_CONFIG_DIR"
          xdg="$XDG_CONFIG_HOME"
          if [ "$RUNNER_OS" = "Windows" ]; then
            target="$(cygpath -u "$target")"
            xdg="$(cygpath -u "$xdg")"
          fi
          for d in "$target" "$xdg"; do
            if [ -e "$d" ]; then echo "::error::$d already exists"; exit 1; fi
          done

          bash cli/status.sh
          bash cli/deploy.sh

          for f in CLAUDE.md settings.json custom/statusline.sh; do
            if [ ! -f "$target/$f" ]; then echo "::error::$f was not deployed"; exit 1; fi
          done
          for f in aliases ignore; do
            if [ ! -f "$xdg/git/$f" ]; then echo "::error::git/$f was not deployed"; exit 1; fi
          done
          # The aliases file must stay valid git config.
          git config --file "$xdg/git/aliases" --get alias.tree >/dev/null

          bash cli/setup-git.sh
          bash cli/setup-git.sh
          if [ "$(git config --global --get-all include.path | wc -l)" -ne 1 ]; then
            echo "::error::setup-git did not add exactly one include.path"; exit 1
          fi
          if ! git config --global --includes --get alias.tree >/dev/null; then
            echo "::error::alias.tree does not resolve through the include"; exit 1
          fi
          # Git Bash has no real executable bit, so only check it on POSIX.
          if [ "$RUNNER_OS" != "Windows" ] && [ ! -x "$target/custom/statusline.sh" ]; then
            echo "::error::custom/statusline.sh is not executable"; exit 1
          fi

          out="$(bash cli/deploy.sh)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq '^[[:space:]]+(added|updated)[[:space:]]'; then
            echo "::error::second deploy changed files"; exit 1
          fi

          bash cli/status.sh

      - name: Smoke test (ps1 entry scripts, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude-pwsh
          XDG_CONFIG_HOME: ${{ runner.temp }}\xdg-pwsh
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\gitconfig-pwsh
          PY_PYTHON: ${{ matrix.python-version }}
        run: &ps1-smoke |
          # Run each entry script in a child process of the same PowerShell
          # edition as this step, so both 5.1 and 7 are exercised.
          $exe = if ($PSVersionTable.PSEdition -eq 'Core') { 'pwsh' } else { 'powershell' }
          Write-Host "PowerShell $($PSVersionTable.PSVersion) ($exe)"

          function Invoke-Entry([string]$Name) {
            $out = & $exe -NoProfile -ExecutionPolicy Bypass -File "cli\$Name.ps1"
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "cli\$Name.ps1 exited with code $code" }
            return $out
          }

          foreach ($d in $env:CLAUDE_CONFIG_DIR, $env:XDG_CONFIG_HOME) {
            if (Test-Path -LiteralPath $d) { throw "$d already exists" }
          }

          Invoke-Entry status | Out-Null
          Invoke-Entry deploy | Out-Null

          foreach ($f in 'CLAUDE.md', 'settings.json', 'custom\statusline.sh') {
            if (-not (Test-Path -LiteralPath (Join-Path $env:CLAUDE_CONFIG_DIR $f) -PathType Leaf)) {
              throw "$f was not deployed"
            }
          }
          foreach ($f in 'git\aliases', 'git\ignore') {
            if (-not (Test-Path -LiteralPath (Join-Path $env:XDG_CONFIG_HOME $f) -PathType Leaf)) {
              throw "$f was not deployed"
            }
          }

          Invoke-Entry setup-git | Out-Null
          Invoke-Entry setup-git | Out-Null
          if (@(git config --global --get-all include.path).Count -ne 1) {
            throw 'setup-git did not add exactly one include.path'
          }
          git config --global --includes --get alias.tree | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'alias.tree does not resolve through the include' }

          $second = Invoke-Entry deploy
          if (@($second) -match '^\s+(added|updated)\s') { throw 'second deploy changed files' }

          Invoke-Entry status | Out-Null

      - name: Smoke test (ps1 entry scripts, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude-powershell
          XDG_CONFIG_HOME: ${{ runner.temp }}\xdg-powershell
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\gitconfig-powershell
          PY_PYTHON: ${{ matrix.python-version }}
        run: *ps1-smoke
